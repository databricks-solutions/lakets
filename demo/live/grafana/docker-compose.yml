services:
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: lakets-grafana
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # mullerpeter-databricks-datasource was removed from the official Grafana
      # plugin catalog but the project is still actively maintained on GitHub.
      # Install from release zip + allow loading as unsigned (community plugin).
      # Repo: https://github.com/mullerpeter/databricks-grafana
      GF_INSTALL_PLUGINS:                       "https://github.com/mullerpeter/databricks-grafana/releases/download/v1.3.8/mullerpeter-databricks-datasource.zip;mullerpeter-databricks-datasource"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "mullerpeter-databricks-datasource"
      # Lakebase (hot tier) — Postgres datasource
      LAKEBASE_HOST:       ${LAKEBASE_HOST:?LAKEBASE_HOST must be set}
      LAKEBASE_PORT:       ${LAKEBASE_PORT:-5432}
      LAKEBASE_DATABASE:   ${LAKEBASE_DATABASE:-databricks_postgres}
      LAKEBASE_USER:       ${LAKEBASE_USER:?LAKEBASE_USER must be set}
      LAKEBASE_PASSWORD:   ${LAKEBASE_PASSWORD:?LAKEBASE_PASSWORD must be set}
      # Databricks SQL (cold tier / UC Delta) — set via setup_grafana_env.sh
      DATABRICKS_HOST:         ${DATABRICKS_HOST:-}
      DATABRICKS_HTTP_PATH:    ${DATABRICKS_HTTP_PATH:-}
      DATABRICKS_TOKEN:        ${DATABRICKS_TOKEN:-}
      DATABRICKS_CATALOG:      ${DATABRICKS_CATALOG:-}
      DATABRICKS_SCHEMA:       ${DATABRICKS_SCHEMA:-}
      DELTA_TABLE:             ${DELTA_TABLE:-stock_ticks_history}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data: {}
