# =============================================================================
# LakeTS Telegraf Configuration
# Collects system metrics and writes to a LakeTS hypertable in Lakebase.
#
# Prerequisites:
#   1. Create the target table in Lakebase:
#      CREATE TABLE public.system_metrics (
#          time TIMESTAMPTZ NOT NULL,
#          host TEXT NOT NULL,
#          metric TEXT NOT NULL,
#          value DOUBLE PRECISION
#      );
#      SELECT lakets.create_hypertable('system_metrics', 'time', '1 day');
#
#   2. Generate an OAuth token:
#      Use the Databricks SDK or MCP tool to generate a credential.
#
#   3. Update the connection string below with your Lakebase host and token.
# =============================================================================

[global_tags]
  environment = "production"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"

# ---- Input Plugins ----

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.system]]

[[inputs.net]]

# ---- Output Plugin: PostgreSQL (Lakebase) ----

[[outputs.postgresql]]
  ## Connection string to Lakebase
  ## Replace <HOST>, <TOKEN> with your Lakebase instance details
  connection = "host=<HOST>.database.us-west-2.staging.cloud.databricks.com port=5432 dbname=databricks_postgres user=<USER>@databricks.com password=<OAUTH_TOKEN> sslmode=require"

  ## Target table (must be a LakeTS hypertable)
  ## Telegraf creates columns dynamically; ensure schema matches
  ## Or use the schema below for a fixed layout:
  #
  # CREATE TABLE public.telegraf_metrics (
  #     time TIMESTAMPTZ NOT NULL DEFAULT now(),
  #     host TEXT,
  #     name TEXT,
  #     tags JSONB,
  #     fields JSONB
  # );
  # SELECT lakets.create_hypertable('telegraf_metrics', 'time', '1 day');

  ## Tags as columns (creates TEXT columns for each tag)
  tags_as_columns = ["host"]

  ## Create table if it doesn't exist
  create_templates = [
    "CREATE TABLE IF NOT EXISTS {{ .table }} (time TIMESTAMPTZ NOT NULL, host TEXT, {{ .columns }})",
  ]
