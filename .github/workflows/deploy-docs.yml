name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

# Default workflow permissions: read-only. The build job exchanges an
# OIDC token for JFrog; the deploy job needs Pages write — both escalate
# at the job level per M2 / least-privilege.
permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus site
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Authenticate with JFrog (configures npm to use db-npm)
        uses: ./.github/actions/jfrog-auth

      - name: Install dependencies
        # The npm registry is configured by the JFrog auth step above; npm ci
        # is hash-enforced against package-lock.json.
        run: npm ci --ignore-scripts

      - name: Build site
        # GitHub Pages serves this project site under /lakets/, so the build
        # must emit assets with that baseUrl (the config defaults to "/" for
        # local/preview builds). Without these, every asset 404s on Pages.
        env:
          DOCS_URL: https://databricks-solutions.github.io
          DOCS_BASE_URL: /lakets/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          # upload-pages-artifact v4+ excludes dotfiles by default. Docusaurus
          # emits `.nojekyll` into website/build so GitHub Pages skips Jekyll
          # processing on `_next/`, `_static/`, etc. Without this opt-in,
          # Pages would Jekyll-process the build and serve broken assets.
          include-hidden-files: true
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
