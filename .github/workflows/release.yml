name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: linux-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag matches VERSION file
        run: |
          # For workflow_dispatch, inputs.tag is e.g. "v0.1.1"; for push events, GITHUB_REF_NAME is e.g. "v0.1.1"
          INPUT_TAG="${{ inputs.tag }}"
          REF_NAME="${GITHUB_REF_NAME}"
          TAG="${INPUT_TAG:-$REF_NAME}"
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$FILE_VERSION" >> "$GITHUB_ENV"

      - name: Build distribution
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum lakets.sql > lakets.sql.sha256
          cat lakets.sql.sha256

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md << 'RELEASE_NOTES'
          ## Install on Lakebase

          ```bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/lakets.sql

          # Verify checksum
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/lakets.sql.sha256
          sha256sum -c lakets.sql.sha256

          # Install
          psql -h <host> -U <user> -d <database> -f lakets.sql
          ```

          ## Install via psycopg2

          ```python
          import psycopg2
          conn = psycopg2.connect(host="<host>", user="<user>", dbname="<database>", password="<token>", sslmode="require")
          conn.autocommit = True
          with open('lakets.sql') as f:
              conn.cursor().execute(f.read())
          ```

          ## Check installed version

          ```sql
          SELECT version, installed_at FROM lakets._version ORDER BY installed_at DESC LIMIT 1;
          ```
          RELEASE_NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "LakeTS ${{ env.RELEASE_TAG }}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            dist/lakets.sql \
            dist/lakets.sql.sha256
