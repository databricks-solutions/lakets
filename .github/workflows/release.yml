name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

# Default to read-only. The single job below escalates the writes it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      # `contents: write` for `gh release create`.
      # `id-token: write` + `attestations: write` for SLSA build provenance
      # (Isaac v2 Recommendation Med #5) — the attestation is published as
      # an OCI artifact in the org's trust store and can be verified by
      # downstream consumers with `gh attestation verify`.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag matches VERSION file
        run: |
          # For workflow_dispatch, inputs.tag is e.g. "v0.1.1"; for push events, GITHUB_REF_NAME is e.g. "v0.1.1"
          INPUT_TAG="${{ inputs.tag }}"
          REF_NAME="${GITHUB_REF_NAME}"
          TAG="${INPUT_TAG:-$REF_NAME}"
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$FILE_VERSION" >> "$GITHUB_ENV"

      - name: Build distribution
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum lakets.sql > lakets.sql.sha256
          cat lakets.sql.sha256

      - name: Generate SLSA build provenance attestation
        # Publishes a signed attestation binding `dist/lakets.sql` to this
        # workflow run + commit. Verifiable downstream with
        #   gh attestation verify lakets.sql --repo databricks-solutions/lakets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'dist/lakets.sql'

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md << 'RELEASE_NOTES'
          ## Install on Lakebase

          ```bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/lakets.sql

          # Verify checksum
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/lakets.sql.sha256
          sha256sum -c lakets.sql.sha256

          # Install
          psql -q -h <host> -U <user> -d <database> -f lakets.sql
          ```

          ## Install via psycopg

          ```python
          import psycopg  # psycopg[binary] (v3)
          conn = psycopg.connect(host="<host>", user="<user>", dbname="<database>", password="<token>", sslmode="require", autocommit=True)
          with open('lakets.sql') as f:
              conn.cursor().execute(f.read())
          ```

          ## Check installed version

          ```sql
          SELECT version, installed_at FROM lakets._version ORDER BY installed_at DESC LIMIT 1;
          ```
          RELEASE_NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "LakeTS ${{ env.RELEASE_TAG }}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            dist/lakets.sql \
            dist/lakets.sql.sha256
