name: PR Labeler

# Trigger choice: pull_request_target (privileged context) is required because
# applying labels needs `pull-requests: write`, which the unprivileged
# `pull_request` trigger cannot grant for PRs opened from forks.
#
# Why this is safe — see Isaac v2 finding I2:
#   - This workflow NEVER checks out PR head contents. `actions/labeler@v5`
#     reads `.github/labeler.yml` from the base ref (the trusted main branch),
#     never from the PR.
#   - There is no `run:` step that interpolates PR-author-controlled context
#     (title, body, branch name, etc.) into shell commands.
#   - Permissions are minimal: `contents: read` + `pull-requests: write`.
# If a future PR ever adds a checkout step here, the trigger MUST be revisited.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path-based labels
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213  # v6.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
