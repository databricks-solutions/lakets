name: Mark stale issues and PRs

on:
  schedule:
    - cron: '0 8 * * *'  # daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: Triage stale issues and PRs
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899  # v10.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 30
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,roadmap,help wanted'
          exempt-pr-labels: 'pinned,security,wip'
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in
            30 days if no further activity occurs. If it's still relevant,
            leave a comment or remove the `stale` label.
          stale-pr-message: |
            This PR has been inactive for 30 days. It will be closed in
            14 days if no further activity occurs. Push a commit, leave a
            comment, or remove the `stale` label to keep it open.
          close-issue-message: |
            Closing due to prolonged inactivity. Please reopen if still relevant.
          close-pr-message: |
            Closing due to prolonged inactivity. Please reopen if you'd like to revive this work.
          operations-per-run: 100
