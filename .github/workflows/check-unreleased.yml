name: Check Unreleased Commits

# Runs daily to detect unreleased commits and open a GitHub issue if found.
# Also runnable manually. Does NOT create releases automatically — that requires
# human approval (push a tag or run workflow_dispatch on release.yml).

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semver bump type for release suggestion'
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read
  issues: write

jobs:
  check-unreleased:
    runs-on: linux-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history needed for git log

      - name: Detect unreleased commits
        id: detect
        run: |
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          LAST_TAG="v${CURRENT_VERSION}"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            COMMITS="$(git log "${LAST_TAG}..HEAD" --oneline)"
          else
            echo "::warning::Tag $LAST_TAG not found — treating all commits as unreleased."
            COMMITS="$(git log --oneline)"
          fi

          if [[ -z "$COMMITS" ]]; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
            echo "No unreleased commits since ${LAST_TAG}."
          else
            COUNT="$(echo "$COMMITS" | wc -l | tr -d ' ')"
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=${COUNT}" >> "$GITHUB_OUTPUT"
            # Store commits for use in later steps (delimiter-safe)
            {
              echo "commits<<COMMITS_EOF"
              echo "$COMMITS"
              echo "COMMITS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        if: steps.detect.outputs.unreleased == 'true'
        id: version
        run: |
          BUMP="${{ inputs.bump_type || 'patch' }}"
          CURRENT="${{ steps.detect.outputs.current_version }}"
          MAJOR="$(echo "$CURRENT" | cut -d. -f1)"
          MINOR="$(echo "$CURRENT" | cut -d. -f2)"
          PATCH="$(echo "$CURRENT" | cut -d. -f3)"
          case "$BUMP" in
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEXT="$((MAJOR + 1)).0.0" ;;
          esac
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "bump_type=${BUMP}" >> "$GITHUB_OUTPUT"

      - name: Open or update release-ready issue
        if: steps.detect.outputs.unreleased == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const currentVersion = '${{ steps.detect.outputs.current_version }}';
            const nextVersion    = '${{ steps.version.outputs.next_version }}';
            const bumpType       = '${{ steps.version.outputs.bump_type }}';
            const commitCount    = '${{ steps.detect.outputs.commit_count }}';
            const lastTag        = '${{ steps.detect.outputs.last_tag }}';
            const commits        = `${{ steps.detect.outputs.commits }}`;

            const title = `chore: release v${nextVersion} (${commitCount} unreleased commit(s))`;
            const body = [
              `## Release Readiness: v${nextVersion}`,
              '',
              `**${commitCount} unreleased commit(s)** found since \`${lastTag}\`.`,
              '',
              '### Unreleased Commits',
              '```',
              commits,
              '```',
              '',
              '### To Release',
              '',
              'Run the local release script (requires push access):',
              '```bash',
              `./bin/release.sh ${bumpType}   # bumps to v${nextVersion}`,
              '```',
              '',
              'Or trigger the release workflow manually:',
              `1. Go to **Actions → Release → Run workflow**`,
              `2. Enter tag: \`v${nextVersion}\``,
              '',
              '> This issue was opened automatically by the **check-unreleased** workflow.',
            ].join('\n');

            // Check for existing open issue with same prefix
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'release-ready',
            });

            const existing = issues.find(i => i.title.startsWith('chore: release'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              // Ensure label exists
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name:  'release-ready',
                  color: '0075ca',
                  description: 'Commits are ready to be released',
                });
              } catch (_) { /* label already exists */ }

              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title,
                body,
                labels: ['release-ready'],
              });
              core.info(`Created issue #${issue.number}`);
            }

      - name: No unreleased commits
        if: steps.detect.outputs.unreleased == 'false'
        run: echo "No unreleased commits since ${{ steps.detect.outputs.last_tag }}. Nothing to do."
