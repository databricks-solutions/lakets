name: CI Security & Quality Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sql-security-lint:
    name: SQL Security Lint
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Check for raw string interpolation in EXECUTE
        run: |
          echo "Checking SQL files for unsafe dynamic SQL patterns..."
          ERRORS=0

          # Check for raw %s (not %I or %L) in EXECUTE/format statements
          if grep -rn "EXECUTE.*format.*'%s'" sql/ --include="*.sql"; then
            echo "::error::Found raw %s in EXECUTE format() — use %I for identifiers or %L for literals"
            ERRORS=$((ERRORS + 1))
          fi

          # Check for SECURITY DEFINER without explicit search_path
          if grep -rn "SECURITY DEFINER" sql/ --include="*.sql" | grep -v "search_path"; then
            echo "::warning::SECURITY DEFINER functions should set search_path explicitly"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::SQL security lint found $ERRORS issue(s)"
            exit 1
          fi
          echo "SQL security lint passed"

  python-security-lint:
    name: Python Security Lint
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Check for f-string SQL injection patterns
        run: |
          echo "Checking Python files for SQL injection patterns..."
          ERRORS=0

          # Check for f-string SQL (SELECT/INSERT/DELETE/UPDATE/DROP)
          if grep -rEn 'f"[^"]*\b(SELECT|INSERT|DELETE|UPDATE|DROP|ALTER)\b' databricks/ --include="*.py"; then
            echo "::error::Found f-string SQL — use parameterized queries or psycopg2.sql module"
            ERRORS=$((ERRORS + 1))
          fi

          # Check for %-format SQL: "SELECT ... %s ..." % (val,)
          if grep -rEn '"[^"]*(SELECT|INSERT INTO|DELETE FROM|UPDATE .* SET|DROP|ALTER)[^"]*"[[:space:]]*%' databricks/ --include="*.py"; then
            echo "::error::Found %-format SQL — use parameterized queries or psycopg2.sql module"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Python security lint found $ERRORS issue(s)"
            exit 1
          fi
          echo "Python security lint passed"

  secret-scan:
    name: Secret Scan
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          ERRORS=0

          # Check for hardcoded tokens/passwords/keys
          if grep -rEni '(password|token|secret|api_key)[[:space:]]*=[[:space:]]*["\x27][^"\x27]{8,}' \
              --include="*.py" --include="*.sql" --include="*.yml" \
              --exclude-dir=".git" --exclude-dir="tests" . \
            | grep -v 'environ\|getenv\|%s\|parameter\|<.*>\|example\|placeholder'; then
            echo "::error::Potential hardcoded secret detected"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Secret scan found $ERRORS issue(s)"
            exit 1
          fi
          echo "Secret scan passed"

  actions-pin-lint:
    name: GitHub Actions SHA-pin Lint
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Verify every external action is pinned to a 40-char SHA
        # Per the Isaac v2 supply-chain analysis (Recommendation High #2):
        # tag-only references (@v4, @main, @latest) are mutable and can be
        # silently retagged upstream. Local composite actions (./.github/...)
        # are exempt.
        run: |
          set -u
          ERRORS=0
          # Scan every `uses:` line that targets a remote action and verify
          # the ref is a 40-character hex SHA.
          while IFS= read -r line; do
            ref="$(echo "$line" | sed -E 's|.*uses:[[:space:]]+([^[:space:]#]+).*|\1|')"
            # Skip local composite refs (start with ./)
            case "$ref" in
              ./*) continue ;;
            esac
            sha="${ref##*@}"
            if ! echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::Unpinned action reference: ${ref} (use a 40-char commit SHA, not a tag)"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(grep -rEn '^\s*-?\s*uses:[[:space:]]+[^[:space:]#]+' .github/workflows/ .github/actions/ 2>/dev/null | grep -v '^[^:]*:[0-9]*:\s*#')
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Actions pin lint found $ERRORS unpinned reference(s)"
            exit 1
          fi
          echo "All external action references are SHA-pinned."

  migration-lint:
    name: Migration Lint
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint migration files
        run: |
          echo "Checking migration files in migrations/..."
          ERRORS=0

          for f in migrations/V*.sql; do
            [ -e "$f" ] || continue

            # Check naming convention: V{digits}_V{digits}_{description}.sql
            filename=$(basename "$f")
            if ! echo "$filename" | grep -qE '^V[0-9]+_V[0-9]+_[a-z0-9_]+\.sql$'; then
              echo "::error file=$f::Migration file does not match naming convention V{from}_V{to}_{description}.sql"
              ERRORS=$((ERRORS + 1))
            fi

            # Check for version guard (must check source version)
            if ! grep -q "FROM lakets._version WHERE version" "$f"; then
              echo "::error file=$f::Migration missing version guard (FROM lakets._version WHERE version)"
              ERRORS=$((ERRORS + 1))
            fi

            # Check for version record (must insert new version)
            if ! grep -q "INSERT INTO lakets._version" "$f"; then
              echo "::error file=$f::Migration must INSERT INTO lakets._version to record applied version"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Migration lint found $ERRORS issue(s)"
            exit 1
          fi
          echo "Migration lint passed"

  python-tests:
    name: Python Unit Tests
    runs-on:
      group: databricks-solutions-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      # Required for the JFrog OIDC token exchange below. Scoped to this
      # job only — the workflow-level default is read-only.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate with JFrog (configures pip to use db-pypi)
        uses: ./.github/actions/jfrog-auth

      - name: Install dependencies
        # requirements.lock is fully resolved + hash-pinned (generated by
        # `uv pip compile --generate-hashes`). --require-hashes rejects any
        # package whose archive doesn't match the locked digest, --no-deps
        # avoids pip resolving anything beyond the lock.
        run: pip3 install --require-hashes --no-deps -r requirements.lock

      - name: Run Python unit tests
        run: python3 -m pytest tests/test_python_patterns.py -v
