# Pre-commit hooks for LakeTS.
#
# Install once:
#     pip install pre-commit
#     pre-commit install
#     pre-commit install --hook-type commit-msg
#
# Run on all files (e.g. to validate before opening a PR):
#     pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.sql$'
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^databricks/bundles/.*\.yml$'
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.0
    hooks:
      - id: sqlfluff-lint
        files: '\.sql$'
        exclude: '^lakets/'
      - id: sqlfluff-fix
        files: '\.sql$'
        exclude: '^lakets/'
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words-list=hist,nd,te,thru]
        exclude: '\.sha256$|^demo/dashboards/.*\.json$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, chore, ci, build, revert]
